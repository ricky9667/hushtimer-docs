site_name: HUSH Timer Docs
site_description: "Documentation for HUSH Timer app."
site_url: https://docs.hushtimer.app/

nav:
    - Welcome: index.md
    - Development:
          - "Getting Started": development/getting-started.md
          - "Troubleshooting": development/troubleshooting.md
          - "Useful Tools": development/useful-tools.md
          - "Release Guide": development/release-guide.md
    - Testing:
          - "Testing Guide": testing/testing-guide.md

theme:
    name: material
    font:
        text: Poppins
        code: Space Mono
    palette:
        - scheme: default
          toggle:
              icon: material/brightness-7
              name: Dark mode
        - scheme: slate
          toggle:
              icon: material/brightness-4
              name: Light mode
    logo: assets/icon.png
    favicon: assets/icon.png

extra:
    social:
        - icon: fontawesome/brands/instagram
          link: https://instagram.com/hush_cubing_apps
          name: HUSH Cubing Apps on Instagram
        - icon: fontawesome/brands/discord
          link: https://discord.gg/GjfMKprt7q
          name: Join HUSH Cubing Apps on Discord

markdown_extensions:
    - pymdownx.details
